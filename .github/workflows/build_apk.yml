name: Build APK and Windows EXE

on:
  push:
    tags:
      - 'v*'  # Kích hoạt khi push tag dạng v1.0.0, v1.1.0...
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID APK (Chạy trên Linux)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradlew
        run: chmod +x gradlew
        working-directory: usbremote

      - name: Build Release APK bằng Gradle
        run: ./gradlew assembleRelease
        working-directory: usbremote

      - name: Lưu trữ artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: usbremote/app/build/outputs/apk/release/app-release-unsigned.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS EXE (Chạy trên Windows)
  # ==========================================
  build-windows:
    name: Build Windows Server EXE
    runs-on: windows-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.10 (Đã bỏ cache để tránh lỗi requirements.txt)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss numpy opencv-python
        working-directory: usbremote

      - name: Đóng gói pc_server.py thành file .exe bằng PyInstaller
        run: |
          pyinstaller --onefile --noconsole pc_server.py
        working-directory: usbremote

      - name: Lưu trữ artifact EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: usbremote/dist/pc_server.exe

  # ==========================================
  # JOB 3: TẠO GITHUB RELEASE VÀ UPLOAD CẢ 2 FILE
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Tải các artifact đã build từ các job trước
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Tạo GitHub Release và đính kèm file
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/app-release-unsigned.apk
            artifacts/windows-exe/pc_server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
