name: Build APK and Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: BUILD ANDROID APK (Chạy trên Linux)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Tự động tạo Gradle Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Release APK bằng Gradle
        run: ./gradlew assembleRelease

      - name: Lưu trữ artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # ==========================================
  # JOB 2: BUILD WINDOWS EXE (Chạy trên Windows)
  # ==========================================
  build-windows:
    name: Build Windows Server EXE
    runs-on: windows-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss numpy opencv-python

      - name: Đóng gói pc_server.py thành file .exe bằng PyInstaller
        run: |
          pyinstaller --onefile --noconsole pc_server.py

      - name: Lưu trữ artifact EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/pc_server.exe

  # ==========================================
  # JOB 3: TẠO GITHUB RELEASE VÀ UPLOAD CẢ 2 FILE
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <--- QUAN TRỌNG: Cấp quyền ghi để tạo Release và upload file
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Tải các artifact đã build từ các job trước
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Tạo GitHub Release và đính kèm file
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-manual' }}
          name: "USB Remote Control Release"
          files: |
            artifacts/android-apk/app-release-unsigned.apk
            artifacts/windows-exe/pc_server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
