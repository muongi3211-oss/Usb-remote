name: Build and Release USB Remote APK

on:
  push:
    tags:
      - 'v*'  # Kích hoạt khi push tag dạng v1.0.0, v1.1.0...
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradlew
        run: chmod +x gradlew
        working-directory: usbremote

      - name: Build Release APK bằng Gradle
        run: ./gradlew assembleRelease
        working-directory: usbremote

      - name: Đăng tải APK lên GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: usbremote/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
